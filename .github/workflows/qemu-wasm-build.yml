name: Build QEMU WASM Engine

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    paths:
      - 'qemu/**' # Optional: Trigger if you keep QEMU source/patches in a subfolder

jobs:
  build-qemu-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build QEMU WASM from Source
        run: |
          mkdir -p output
          
          # Build QEMU using the specialized Emscripten compilation container
          docker build -t qemu-wasm-builder https://github.com/ktock/qemu-wasm-sample.git#main
          
          # Run container and extract compiled WASM and JS outputs
          CONTAINER_ID=$(docker create qemu-wasm-builder)
          docker cp $CONTAINER_ID:/qemu/build/qemu-system-x86_64.js ./output/qemu-system-x86_64.js
          docker cp $CONTAINER_ID:/qemu/build/qemu-system-x86_64.wasm ./output/qemu-system-x86_64.wasm
          docker rm $CONTAINER_ID

      - name: Commit and Push Binaries to Repository
        run: |
          mkdir -p web
          cp output/qemu-system-x86_64.js web/qemu-system-x86_64.js
          cp output/qemu-system-x86_64.wasm web/qemu-system-x86_64.wasm
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add web/qemu-system-x86_64.js web/qemu-system-x86_64.wasm
          
          # Only commit if changes were detected
          if git status --porcelain | grep -E 'qemu-system-x86_64\.(js|wasm)'; then
            git commit -m "ci: update precompiled qemu-system-x86_64 WASM binaries"
            git push
          else
            echo "No changes in compiled WASM outputs."
          fi