name: Build QEMU WASM Engine

on:
  workflow_dispatch:

jobs:
  build-qemu-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build QEMU WASM from Source
        run: |
          mkdir -p output
          
          # 1. Clone patched QEMU WASM repository
          git clone --depth 1 https://github.com/ktock/qemu-wasm.git qemu-src
          
          # 2. Build the self-contained Emscripten build environment container
          docker build -t buildqemu ./qemu-src
          
          # 3. Run container and build qemu-system-x86_64 inside
          CONTAINER_ID=$(docker run -d buildqemu tail -f /dev/null)
          
          docker exec $CONTAINER_ID /bin/bash -c "
            cd /qemu && \
            emconfigure ./configure --static --disable-tools --target-list=x86_64-softmmu && \
            emmake make -j\$(nproc)
          "
          
          # 4. Extract generated artifacts
          docker cp $CONTAINER_ID:/qemu/build/qemu-system-x86_64.js ./output/qemu-system-x86_64.js
          docker cp $CONTAINER_ID:/qemu/build/qemu-system-x86_64.wasm ./output/qemu-system-x86_64.wasm
          
          docker rm -f $CONTAINER_ID

      - name: Commit and Push Binaries
        run: |
          mkdir -p web
          cp output/qemu-system-x86_64.js web/qemu-system-x86_64.js
          cp output/qemu-system-x86_64.wasm web/qemu-system-x86_64.wasm
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add web/qemu-system-x86_64.js web/qemu-system-x86_64.wasm
          
          if git status --porcelain | grep -E 'qemu-system-x86_64\.(js|wasm)'; then
            git commit -m "ci: update precompiled qemu-system-x86_64 WASM binaries"
            git push
          else
            echo "No changes detected in compiled binaries."
          fi