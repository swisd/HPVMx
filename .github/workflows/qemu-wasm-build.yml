name: Build QEMU WASM Engine

on:
  workflow_dispatch:

jobs:
  build-qemu-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Emscripten SDK
        uses: mymindstorm/setup-emsdk@v13
        with:
          version: 3.1.50 # Stable Emscripten release for QEMU build targets

      - name: Install System Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            pkg-config \
            libglib2.0-dev \
            libpixman-1-dev \
            flex \
            bison \
            python3 \
            python3-pip

      - name: Clone QEMU Source
        run: |
          # Clone stable QEMU source with WASM patches
          git clone --depth 1 https://github.com/ktock/qemu-wasm.git qemu-src
      - name: Configure and Build QEMU to WebAssembly
        run: |
          cd qemu-src
          
          unset EMCC_CFLAGS
          unset EMXX_CFLAGS
          
          # 1. Clone a verified WebAssembly-compatible GLib port (or standard GLib configured for cross)
          git clone https://gnome.org ../glib-wasm
          cd ../glib-wasm
          git checkout 2.78.0 # Use a stable version matching your setup
          
          # 2. Create an Emscripten cross-file for Meson
          cat <<EOF > emscripten-cross.txt
          [binaries]
          c = 'emcc'
          cpp = 'em++'
          ar = 'emar'
          strip = 'emstrip'
          pkgconfig = 'pkg-config'
          
          [host_machine]
          system = 'emscripten'
          cpu_family = 'wasm32'
          cpu = 'wasm32'
          endian = 'little'
          EOF
          
          # 3. Compile GLib into a temporary prefix directory
          meson setup builddir --cross-file emscripten-cross.txt --prefix=/home/runner/work/glib-sysroot -Dtests=false -Diconv=external
          meson compile -C builddir
          meson install -C builddir
          
          # 4. Return to your QEMU source directory
          cd ../qemu-src
          
          
          export EMCC_CFLAGS="-s USE_ZLIB=1 -s ALLOW_MEMORY_GROWTH=1"
          export EMXX_CFLAGS="-s USE_ZLIB=1 -s ALLOW_MEMORY_GROWTH=1"
          export PKG_CONFIG_PATH=/home/runner/work/glib-sysroot/lib/x86_64-linux-gnu/pkgconfig:/home/runner/work/glib-sysroot/lib/pkgconfig
          
          # Pass --cpu=wasm32 and --cross-prefix= to force Meson into cross-compile mode
          emconfigure ./configure \
            --target-list=x86_64-softmmu \
            --cpu=wasm32 \
            --cross-prefix= \
            --static \
            --disable-tools \
            --disable-cocoa \
            --disable-sdl \
            --disable-gtk \
            --disable-vnc \
            --disable-kvm \
            --disable-xen \
            --disable-guest-agent \
            --disable-pie \
            --disable-modules \
            --disable-docs \
            --enable-download
  

          # Compile using Emscripten make
          emmake make -j$(nproc)
          
          # Stage compiled outputs
          mkdir -p ../output
          cp build/qemu-system-x86_64.js ../output/qemu-system-x86_64.js
          cp build/qemu-system-x86_64.wasm ../output/qemu-system-x86_64.wasm

      - name: Commit and Push Binaries to Web Folder
        run: |
          mkdir -p web
          cp output/qemu-system-x86_64.js web/qemu-system-x86_64.js
          cp output/qemu-system-x86_64.wasm web/qemu-system-x86_64.wasm
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add web/qemu-system-x86_64.js web/qemu-system-x86_64.wasm
          
          if git status --porcelain | grep -E 'qemu-system-x86_64\.(js|wasm)'; then
            git commit -m "ci: update precompiled qemu-system-x86_64 WASM binaries"
            git push
          else
            echo "No binary changes detected."
          fi