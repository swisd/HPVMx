name: Build QEMU WASM Engine

on:
  workflow_dispatch:

jobs:
  build-qemu-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Emscripten SDK
        uses: mymindstorm/setup-emsdk@v13
        with:
          version: 3.1.50 # Stable Emscripten release for QEMU build targets

      - name: Install System Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            pkg-config \
            libglib2.0-dev \
            libpixman-1-dev \
            flex \
            bison \
            python3 \
            python3-pip

      - name: Clone QEMU Source
        run: |
          # Clone stable QEMU source with WASM patches
          git clone --depth 1 https://github.com/ktock/qemu-wasm.git qemu-src

      - name: Configure and Build QEMU to WebAssembly
        run: |
          cd qemu-src
          
          # Pass --cpu=wasm32 and --cross-prefix= to force Meson into cross-compile mode
          # Clear contamination
          unset EMCC_CFLAGS
          unset EMXX_CFLAGS
          
          # 2. Tell Emscripten to inherit standard zlib utilities
          export EMCC_CFLAGS="-s USE_ZLIB=1 -s ALLOW_MEMORY_GROWTH=1"
          export EMXX_CFLAGS="-s USE_ZLIB=1 -s ALLOW_MEMORY_GROWTH=1"
          
          # 3. USE SYSTEM VENV ROUTE (Bypasses missing scripts/mkvenv.py error)
          python3 -m venv build/pyvenv
          build/pyvenv/bin/pip install meson==1.2.3
          
          cat <<EOF > emscripten-cross.txt
          [binaries]
          c = 'emcc'
          cpp = 'em++'
          ar = 'emar'
          strip = 'emstrip'
          pkgconfig = 'pkg-config'
          
          [host_machine]
          system = 'emscripten'
          cpu_family = 'wasm32'
          cpu = 'wasm32'
          endian = 'little'
          EOF
          
          # Point configuration to compile dependencies via Meson internally using its download wrap system
          #          emconfigure ./configure \
          #          --target-list=x86_64-softmmu \
          #          --cpu=wasm32 \
          #          --cross-prefix= \
          #          --static \
          #          --disable-tools \
          #          --disable-cocoa \
          #          --disable-sdl \
          #          --disable-gtk \
          #          --disable-vnc \
          #          --disable-kvm \
          #          --disable-xen \
          #          --disable-guest-agent \
          #          --disable-pie \
          #          --disable-modules \
          #          --disable-docs \
          #          --enable-download \
          #          --meson="meson --wrap-mode=force"
          
          # Force Meson to build the environment and download fallbacks safely
          build/pyvenv/bin/meson setup build \
            --cross-file emscripten-cross.txt \
            --wrap-mode=forcefallback \
            -Ddefault_library=static \
            -Dtools=false \
            -Dcocoa=disabled \
            -Dsdl=disabled \
            -Dgtk=disabled \
            -Dvnc=disabled \
            -Dkvm=disabled \
            -Dxen=disabled \
            -Dguest_agent=false \
            -Ddocs=disabled \
            -Dpie=false
          
          
          
          # Compile using all available processor cores
          build/pyvenv/bin/meson compile -C build -j$(nproc)
          
          # Stage your outputs into your output folder
          mkdir -p ../output
          cp build/qemu-system-x86_64 ../output/qemu-system-x86_64.js 2>/dev/null || cp build/qemu-system-x86_64.wasm ../output/qemu-system-x86_64.wasm


      - name: Commit and Push Binaries to Web Folder
        run: |
          mkdir -p web
          cp output/qemu-system-x86_64.js web/qemu-system-x86_64.js
          cp output/qemu-system-x86_64.wasm web/qemu-system-x86_64.wasm
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add web/qemu-system-x86_64.js web/qemu-system-x86_64.wasm
          
          if git status --porcelain | grep -E 'qemu-system-x86_64\.(js|wasm)'; then
            git commit -m "ci: update precompiled qemu-system-x86_64 WASM binaries"
            git push
          else
            echo "No binary changes detected."
          fi