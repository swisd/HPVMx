[package]
name = "HPVMx"
version = "1.16.3"
edition = "2024"

[[bin]]
name = "HPVMx"
path = "src/main.rs"

[features]
default = []
# The X4 subsystem is an incomplete Windows compatibility/decompilation layer.
# Keep it opt-in until its generated ABI surface is implemented consistently.
x4 = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"



[dependencies]
x86_64 = "^0.15.5"
raw-cpuid = "11.6.0"
buddy_system_allocator = "0.13.0"
uefi = { version = "0.40.0", features = ["alloc", "logger", "panic_handler", "unstable", "default", "global_allocator"] }
# smoltcp = { version = "0.13.0", default-features = false, features = ["proto-ipv4", "medium-ip", "socket-raw"] }
# ixgbe/e1000 drivers needed
log = "0.4.29"
uefi-raw = "0.16.0"
# Hypervisor dependencies
bitflags = "2.4.0"
elf = { version = "0.8.0", default-features = false }


# Other
libm = "0.2.16"
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde-json-core = "0.6.0"
hashbrown = { version = "0.17.1", features = ["serde"] }
tinybmp = "0.7.0"
embedded-graphics = "0.8.2"
postcard = { version = "1.1.3", features = ["alloc"] }
#lazy_static = "1.5.0"
#[build-dependencies]
#cc = "1.2.60"
ordered-float = { version = "5.5.0", default-features = false }
serde-big-array = "0.5.1"
bincode = { version = "2.0.0-rc.3", features = ["alloc", "serde"], default-features = false }
